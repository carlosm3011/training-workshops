// The master's named.conf, seeded into an empty /etc/bind on first boot.
// Unlike Ubuntu's stock file it has no top-level zones: with views, every
// zone must live in a view, so named.conf.lab (generated on first boot by
// dnslab-master-setup) holds them all.
include "/etc/bind/named.conf.options";
include "/etc/bind/named.conf.lab";
