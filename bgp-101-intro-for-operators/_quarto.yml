# Shared config for both PDFs. The chapter lists live only in the
# profile files (_quarto-book.yml, _quarto-labguide.yml): Quarto appends
# a profile's book.chapters to this file's, so none may be listed here.
# Always build via `make book` (see mk/course.mk).
project:
  type: book

book:
  author:
    - name: "Carlos M. Martinez"
      affiliation:
        - name: "XT6 Labs"
  keyword: "bgp, routing, frr, containerlab"
  date: today
  date-format: "YYYY-MM-DD"

lang: en

format:
  pdf:
    toc: true
    toc-depth: 2
    number-sections: true
    fontsize: 11pt
    geometry:
      - margin=1in
    colorlinks: true
    linkcolor: blue
    urlcolor: blue
    # Generated by `make book` from title-page.tex.in, with @@VERSION@@
    # and the version history substituted (scripts/generate-title-page.sh).
    include-in-header: title-page.tex
