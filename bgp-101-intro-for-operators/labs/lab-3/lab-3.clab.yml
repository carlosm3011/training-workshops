# Lab 3 - Multi-Homing, Policy, and Traffic Engineering.
#   cd labs/lab-3 && sudo containerlab deploy
# r1, r2 and r4 (AS 65000) start with their interfaces addressed and OSPF
# running; their BGP configuration is yours. isp1 (AS 65001) and isp2
# (AS 65002) are fully configured. solution/ holds the finished configs.
name: bgp101-lab3

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.7.1
  nodes:
    isp1:
      binds:
        - ../daemons:/etc/frr/daemons:ro
        - ../vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/isp1.conf:/etc/frr/frr.conf:ro
    r1:
      binds:
        - ../daemons:/etc/frr/daemons:ro
        - ../vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/r1.conf:/etc/frr/frr.conf:ro
    r2:
      binds:
        - ../daemons:/etc/frr/daemons:ro
        - ../vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/r2.conf:/etc/frr/frr.conf:ro
    r4:
      binds:
        - ../daemons:/etc/frr/daemons:ro
        - ../vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/r4.conf:/etc/frr/frr.conf:ro
    isp2:
      binds:
        - ../daemons:/etc/frr/daemons:ro
        - ../vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/isp2.conf:/etc/frr/frr.conf:ro

  links:
    - endpoints: ["isp1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "r4:eth1"]
    - endpoints: ["r4:eth2", "isp2:eth1"]
