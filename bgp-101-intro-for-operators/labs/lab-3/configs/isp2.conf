frr defaults traditional
hostname isp2
!
ip forwarding
!
! An upstream provider (AS 65002). Fully configured: you don't need to
! change it. It sends you a default route, its own 203.0.113.0/24, the
! "remote" network 198.18.0.0/24 (which the other ISP also announces),
! and some routes that a careful operator doesn't accept.
!
interface eth1
 description to AS 65000
 ip address 10.0.2.100/24
exit
!
interface lo
 ip address 203.0.113.1/32
 ip address 198.18.0.1/32
exit
!
ip route 203.0.113.0/24 blackhole
ip route 198.18.0.0/24 blackhole
ip route 172.20.0.0/16 blackhole
ip route 203.0.113.0/25 blackhole
!
router bgp 65002
 bgp router-id 203.0.113.1
 no bgp ebgp-requires-policy
 neighbor 10.0.2.4 remote-as 65000
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  network 198.18.0.0/24
  network 172.20.0.0/16
  network 203.0.113.0/25
  neighbor 10.0.2.4 default-originate
 exit-address-family
exit
!
