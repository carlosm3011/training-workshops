frr defaults traditional
hostname r1
!
ip forwarding
!
interface eth1
 description to isp1 (AS 65001)
 ip address 10.0.1.1/24
exit
!
interface eth2
 description to r2
 ip address 10.0.12.1/24
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.255.0.1
exit
!
