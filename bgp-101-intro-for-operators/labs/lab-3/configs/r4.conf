frr defaults traditional
hostname r4
!
ip forwarding
!
interface eth1
 description to r2
 ip address 10.0.24.4/24
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description to isp2 (AS 65002)
 ip address 10.0.2.4/24
exit
!
interface lo
 ip address 10.255.0.4/32
 ip ospf area 0
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.255.0.4
exit
!
