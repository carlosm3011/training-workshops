frr defaults traditional
hostname isp1
!
ip forwarding
!
! An upstream provider (AS 65001). Fully configured: you don't need to
! change it. It sends you a default route, its own 198.51.100.0/24, the
! "remote" network 198.18.0.0/24 (which the other ISP also announces),
! and some routes that a careful operator doesn't accept.
!
interface eth1
 description to AS 65000
 ip address 10.0.1.100/24
exit
!
interface lo
 ip address 198.51.100.1/32
 ip address 198.18.0.1/32
exit
!
ip route 198.51.100.0/24 blackhole
ip route 198.18.0.0/24 blackhole
ip route 10.99.0.0/16 blackhole
ip route 198.51.100.128/25 blackhole
!
router bgp 65001
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 neighbor 10.0.1.1 remote-as 65000
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  network 198.18.0.0/24
  network 10.99.0.0/16
  network 198.51.100.128/25
  neighbor 10.0.1.1 default-originate
 exit-address-family
exit
!
