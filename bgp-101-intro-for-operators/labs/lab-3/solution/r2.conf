frr defaults traditional
hostname r2
!
ip forwarding
!
interface eth1
 description to r1
 ip address 10.0.12.2/24
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description to r4
 ip address 10.0.24.2/24
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface lo
 ip address 10.255.0.2/32
 ip address 192.0.2.2/32
 ip ospf area 0
 ip ospf passive
exit
!
router ospf
 ospf router-id 10.255.0.2
exit
!
! Task 2: iBGP to both borders, as their route reflector
router bgp 65000
 bgp router-id 10.255.0.2
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.4 remote-as 65000
 neighbor 10.255.0.4 update-source lo
 !
 address-family ipv4 unicast
  neighbor 10.255.0.1 route-reflector-client
  neighbor 10.255.0.4 route-reflector-client
 exit-address-family
exit
!
