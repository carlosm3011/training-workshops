# Lab 2 - iBGP, MP-BGP, and Route Origination.
#   cd labs/lab-2 && sudo containerlab deploy
# r1 and r2 (AS 65000) start with their interfaces addressed; their BGP
# configuration is yours. r3 (the provider, AS 65001) and srv (a host on
# the Lab-Services LAN) are fully configured. solution/ holds the
# finished configs.
name: bgp101-lab2

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.7.1
  nodes:
    r1:
      binds:
        - ../daemons:/etc/frr/daemons:ro
        - ../vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/r1.conf:/etc/frr/frr.conf:ro
    r2:
      binds:
        - ../daemons:/etc/frr/daemons:ro
        - ../vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/r2.conf:/etc/frr/frr.conf:ro
    r3:
      binds:
        - ../daemons:/etc/frr/daemons:ro
        - ../vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/r3.conf:/etc/frr/frr.conf:ro
    srv:
      binds:
        - ../daemons:/etc/frr/daemons:ro
        - ../vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/srv.conf:/etc/frr/frr.conf:ro

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r1:eth3", "srv:eth1"]
