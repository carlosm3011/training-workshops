frr defaults traditional
hostname r3
!
ip forwarding
ipv6 forwarding
!
! The provider (AS 65001). Fully configured: you don't need to change it.
!
interface eth1
 description to r1 (customer, AS 65000)
 ip address 10.0.13.3/24
 ipv6 address 2001:db8:13::3/64
exit
!
interface lo
 ip address 198.51.100.1/32
 ipv6 address 2001:db8:cafe::1/128
exit
!
ip route 198.51.100.0/24 blackhole
ipv6 route 2001:db8:cafe::/48 blackhole
!
router bgp 65001
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 neighbor 10.0.13.1 remote-as 65000
 neighbor 2001:db8:13::1 remote-as 65000
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  no neighbor 2001:db8:13::1 activate
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8:cafe::/48
  neighbor 2001:db8:13::1 activate
 exit-address-family
exit
!
