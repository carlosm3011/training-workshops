# Lab 1 - Establishing Basic BGP Connectivity.
#   cd labs/lab-1 && sudo containerlab deploy
# Each router starts with its interfaces addressed (configs/<node>.conf);
# the BGP configuration is yours. solution/ holds the finished configs.
name: bgp101-lab1

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.7.1
  nodes:
    router-a:
      binds:
        - ../daemons:/etc/frr/daemons:ro
        - ../vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/router-a.conf:/etc/frr/frr.conf:ro
    router-b:
      binds:
        - ../daemons:/etc/frr/daemons:ro
        - ../vtysh.conf:/etc/frr/vtysh.conf:ro
        - configs/router-b.conf:/etc/frr/frr.conf:ro

  links:
    - endpoints: ["router-a:eth1", "router-b:eth1"]
