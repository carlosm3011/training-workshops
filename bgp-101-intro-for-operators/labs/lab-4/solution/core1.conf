frr defaults traditional
hostname core1
!
ip forwarding
!
interface eth1
 description to br-west
 ip address 10.0.12.1/24
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description to br-east
 ip address 10.0.13.1/24
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth3
 description to cust-a (AS 65100)
 ip address 10.0.100.1/30
 ip ospf area 0
 ip ospf passive
exit
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
 ip ospf passive
exit
!
! Task 4: RTBH discard next hop, routed to a blackhole on every router
ip route 192.0.2.1/32 blackhole
!
! Task 2: strict customer filter. Task 4 adds the /32s tagged for RTBH.
ip prefix-list PL-CUST-A seq 5 permit 203.0.113.0/24
ip prefix-list PL-CUST-A-RTBH seq 5 permit 203.0.113.0/24 ge 32
!
bgp community-list standard CL-RTBH seq 5 permit 65000:666
!
route-map RM-CUST-A-IN permit 10
 match ip address prefix-list PL-CUST-A-RTBH
 match community CL-RTBH
 set ip next-hop 192.0.2.1
 set community no-export additive
exit
!
route-map RM-CUST-A-IN permit 20
 match ip address prefix-list PL-CUST-A
exit
!
route-map RM-CUST-A-OUT permit 10
exit
!
router bgp 65000
 bgp router-id 10.255.0.1
 neighbor 10.0.100.2 remote-as 65100
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 update-source lo
 neighbor 10.255.0.3 remote-as 65000
 neighbor 10.255.0.3 update-source lo
 !
 address-family ipv4 unicast
  neighbor 10.0.100.2 maximum-prefix 5
  neighbor 10.0.100.2 route-map RM-CUST-A-IN in
  neighbor 10.0.100.2 route-map RM-CUST-A-OUT out
  neighbor 10.255.0.2 route-reflector-client
  neighbor 10.255.0.3 route-reflector-client
 exit-address-family
exit
!
router ospf
 ospf router-id 10.255.0.1
exit
!
