frr defaults traditional
hostname br-west
!
ip forwarding
!
interface eth1
 description to core1
 ip address 10.0.12.2/24
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description to up1 (AS 65001)
 ip address 10.0.1.2/24
exit
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
 ip ospf passive
exit
!
! Task 4: RTBH discard next hop, routed to a blackhole on every router
ip route 192.0.2.1/32 blackhole
!
! Task 3: announce our block and our customer's, nothing else
ip route 192.0.2.0/24 blackhole
ip prefix-list PL-EXPORT seq 5 permit 192.0.2.0/24
ip prefix-list PL-EXPORT seq 10 permit 203.0.113.0/24
!
! Task 3: UP-1 is the primary upstream
route-map RM-UP-IN permit 10
 set local-preference 200
exit
!
route-map RM-UP-OUT permit 10
 match ip address prefix-list PL-EXPORT
exit
!
router bgp 65000
 bgp router-id 10.255.0.2
 neighbor 10.0.1.100 remote-as 65001
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 !
 address-family ipv4 unicast
  network 192.0.2.0/24
  neighbor 10.0.1.100 route-map RM-UP-IN in
  neighbor 10.0.1.100 route-map RM-UP-OUT out
  neighbor 10.255.0.1 next-hop-self
 exit-address-family
exit
!
router ospf
 ospf router-id 10.255.0.2
exit
!
