frr defaults traditional
hostname br-east
!
ip forwarding
!
interface eth1
 description to core1
 ip address 10.0.13.3/24
 ip ospf area 0
 ip ospf network point-to-point
exit
!
interface eth2
 description to up2 (AS 65002)
 ip address 10.0.2.3/24
exit
!
interface lo
 ip address 10.255.0.3/32
 ip ospf area 0
 ip ospf passive
exit
!
! Task 4: RTBH discard next hop, routed to a blackhole on every router
ip route 192.0.2.1/32 blackhole
!
! Task 3: announce our block and our customer's, nothing else
ip route 192.0.2.0/24 blackhole
ip prefix-list PL-EXPORT seq 5 permit 192.0.2.0/24
ip prefix-list PL-EXPORT seq 10 permit 203.0.113.0/24
!
route-map RM-UP-IN permit 10
exit
!
! Task 3: make the path through UP-2 look longer
route-map RM-UP-OUT permit 10
 match ip address prefix-list PL-EXPORT
 set as-path prepend 65000 65000 65000
exit
!
router bgp 65000
 bgp router-id 10.255.0.3
 neighbor 10.0.2.100 remote-as 65002
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 update-source lo
 !
 address-family ipv4 unicast
  network 192.0.2.0/24
  neighbor 10.0.2.100 route-map RM-UP-IN in
  neighbor 10.0.2.100 route-map RM-UP-OUT out
  neighbor 10.255.0.1 next-hop-self
 exit-address-family
exit
!
router ospf
 ospf router-id 10.255.0.3
exit
!
