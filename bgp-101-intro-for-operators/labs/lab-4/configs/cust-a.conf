frr defaults traditional
hostname cust-a
!
ip forwarding
!
! CUST-A (AS 65100), a customer of AS 65000. Its address block is
! 203.0.113.0/24; 203.0.113.50 is a server that will come under attack.
! Task 4 asks you to change this router; leave the rest as it is.
!
interface eth1
 description to core1 (AS 65000)
 ip address 10.0.100.2/30
exit
!
interface lo
 ip address 203.0.113.1/32
 ip address 203.0.113.50/32
exit
!
ip route 203.0.113.0/24 blackhole
ip route 198.51.100.0/24 blackhole
!
router bgp 65100
 bgp router-id 203.0.113.1
 no bgp ebgp-requires-policy
 neighbor 10.0.100.1 remote-as 65000
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  network 203.0.113.0/24
 exit-address-family
exit
!
