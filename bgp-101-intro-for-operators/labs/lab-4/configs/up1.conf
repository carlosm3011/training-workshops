frr defaults traditional
hostname up1
!
ip forwarding
!
! An upstream provider (AS 65001). Fully configured: you don't need to
! change it. It sends you a default route and 198.18.0.0/24, a remote
! network that the other upstream also announces.
!
interface eth1
 description to AS 65000
 ip address 10.0.1.100/24
exit
!
interface lo
 ip address 10.0.1.100/32
 ip address 198.18.0.1/32
exit
!
ip route 198.18.0.0/24 blackhole
!
router bgp 65001
 bgp router-id 10.0.1.100
 no bgp ebgp-requires-policy
 neighbor 10.0.1.2 remote-as 65000
 !
 address-family ipv4 unicast
  network 198.18.0.0/24
  neighbor 10.0.1.2 default-originate
 exit-address-family
exit
!
