name: Publish PDF release

# Release tags are per course: <course-dir>/vX.Y.Z (created by
# `make release` in that course). The PDF is not built here - it is
# the one committed under <course-dir>/_book/.
on:
  push:
    tags:
      - "*/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find PDF in <course>/_book
        id: pdf
        env:
          TAG: ${{ github.ref_name }}
        run: |
          COURSE="${TAG%%/*}"
          PDF_PATH=$(find "$COURSE/_book" -maxdepth 1 -iname "*.pdf" | head -n 1)
          if [ -z "$PDF_PATH" ]; then
            echo "No PDF found under $COURSE/_book" >&2
            exit 1
          fi
          echo "path=$PDF_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$PDF_PATH")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pdf.outputs.path }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
